<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UP — Nova Tarefa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-form">

<div class="overlay open">
    <div class="modal">

        <!-- Cabeçalho com abas -->
        <div class="modal-head">
            <div class="modal-tabs">
                <button type="button" class="tab-btn active" data-tab="TAREFA">Tarefa</button>
                <button type="button" class="tab-btn" data-tab="DOCUMENTO">Documento</button>
                <button type="button" class="tab-btn" data-tab="LEMBRETE">Lembrete</button>
            </div>
            <a class="modal-close" th:href="@{/dashboard}" title="Fechar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </a>
        </div>

        <!-- Mensagem de sucesso -->
        <div class="alerta-sucesso" th:if="${sucesso}" th:text="${sucesso}"></div>
        <div class="alerta-negocio" th:if="${erroNegocio}" th:text="${erroNegocio}"></div>

        <form th:action="@{/tarefas/criar}" th:object="${tarefa}" method="post">

            <!-- Tag selectors -->
            <div class="tag-selectors">
                <div class="tag-sel">
                    Recrutamento
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </div>
                <div class="tag-sel">
                    <select th:field="*{etapa}"
                            style="background:transparent;border:none;outline:none;color:#fff;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;">
                        <option th:each="e : ${etapas}" th:value="${e}" th:text="${e.label}"></option>
                    </select>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </div>
            </div>

            <!-- Tipo (hidden, controlado pelas abas) -->
            <input type="hidden" th:field="*{tipo}" id="tipoInput">

            <!-- Nome + Empresa -->
            <div class="form-row">
                <div class="fg">
                    <input class="inp" th:classappend="${#fields.hasErrors('nome')} ? 'err'"
                           type="text" th:field="*{nome}" placeholder="Nome:">
                    <span class="ferr" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                </div>
                <div class="sel-wrap">
                    <select th:field="*{empresa}">
                        <option value="">Empresa:</option>
                        <option th:each="u : ${usuarios}"
                                th:value="${u.nome}"
                                th:text="${u.nome}"></option>
                    </select>
                </div>
            </div>

            <!-- Equipe + Responsável -->
            <div class="form-row">
                <div class="sel-wrap">
                    <select th:field="*{equipe}">
                        <option value="">Equipe:</option>
                        <option value="Design">Design</option>
                        <option value="Desenvolvimento">Desenvolvimento</option>
                        <option value="RH">RH</option>
                        <option value="Marketing">Marketing</option>
                    </select>
                </div>
                <div class="sel-wrap">
                    <select th:field="*{responsavel}">
                        <option value="">Responsável:</option>
                        <option th:each="u : ${usuarios}"
                                th:value="${u.nome}"
                                th:text="${u.nome}"></option>
                    </select>
                </div>
            </div>

            <!-- Descrição -->
            <div class="fg-full">
                <textarea class="inp-area" th:field="*{descricao}" placeholder="Descrição:"></textarea>
            </div>

            <div class="form-acts">
                <button type="submit" class="btn-cadastrar">Cadastrar</button>
            </div>

        </form>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
<script>
    // Abas controlam o campo tipo
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tipoInput').value = btn.dataset.tab
        });
    });
    // Pré-seleciona aba com base no valor atual
    const tipoAtual = document.getElementById('tipoInput').value || 'TAREFA';
    document.querySelector('[data-tab="' + tipoAtual + '"]')?.classList.add('active');
</script>
</body>
</html>
