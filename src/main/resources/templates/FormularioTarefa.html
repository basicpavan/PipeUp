<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pipe Up - Nova Tarefa</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1e1e2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Modal ───────────────────────────────────── */
        .modal {
            background: #4d6ef5;
            border-radius: 16px;
            padding: 28px 32px 32px;
            width: 520px;
            max-width: calc(100vw - 32px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        /* ── Cabeçalho ───────────────────────────────── */
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .modal-titulo {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }
        .modal-fechar {
            background: #fff;
            border: none;
            border-radius: 50%;
            width: 26px; height: 26px;
            font-size: 13px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: #333;
            text-decoration: none;
            transition: background .15s;
        }
        .modal-fechar:hover { background: #f0f0f0; }

        /* ── Alertas ─────────────────────────────────── */
        .alerta-sucesso {
            background: rgba(77,255,150,0.15);
            border: 1px solid #4dff96;
            border-radius: 8px;
            padding: 10px 16px;
            color: #d0ffe8;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .alerta-negocio {
            background: rgba(255,77,77,0.2);
            border: 1px solid #ff4d4d;
            border-radius: 8px;
            padding: 10px 16px;
            color: #ffe0e0;
            font-size: 13px;
            margin-bottom: 12px;
        }

        /* ── Formulário ──────────────────────────────── */
        .modal-form { display: flex; flex-direction: column; gap: 10px; }

        .campo-grupo {
            display: flex;
            align-items: center;
            background: #fff;
            border-radius: 50px;
            padding: 0 18px;
            height: 44px;
            gap: 6px;
            border: 2px solid transparent;
            transition: border-color .15s;
        }
        .campo-grupo.erro { border-color: #ff4d4d; }

        /* Select também usa o mesmo estilo de cápsula */
        .campo-grupo select {
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            color: #555;
            width: 100%;
            font-family: 'Segoe UI', sans-serif;
            cursor: pointer;
        }

        .campo-label {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
            min-width: fit-content;
        }
        .campo-input {
            border: none; outline: none; background: transparent;
            font-size: 13px; color: #555; width: 100%;
            font-family: 'Segoe UI', sans-serif;
        }
        .campo-input::placeholder { color: #aaa; }

        .campo-linha { display: flex; gap: 10px; }
        .campo-metade { flex: 1; display: flex; flex-direction: column; gap: 4px; }

        .msg-erro {
            color: #ffe0e0;
            font-size: 11px;
            margin-left: 18px;
        }

        input[type="date"] { cursor: pointer; }
        input[type="date"]::-webkit-calendar-picker-indicator { opacity: .5; cursor: pointer; }

        /* ── Botão ───────────────────────────────────── */
        .modal-rodape { display: flex; justify-content: flex-end; margin-top: 8px; }
        .btn-criar {
            background: #ff7f2a;
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 11px 32px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: background .15s, transform .1s;
        }
        .btn-criar:hover { background: #e96e1a; transform: translateY(-1px); }
        .btn-criar:active { transform: translateY(0); }
    </style>
</head>
<body>

<div class="modal">

    <!-- Cabeçalho -->
    <div class="modal-header">
        <span class="modal-titulo">Tarefa</span>
        <a class="modal-fechar" href="/" title="Fechar">&#x2715;</a>
    </div>

    <!-- Mensagem de sucesso -->
    <div class="alerta-sucesso" th:if="${sucesso}" th:text="${sucesso}"></div>

    <!-- Erro de negócio (e-mail duplicado, etc.) -->
    <div class="alerta-negocio" th:if="${erroNegocio}" th:text="${erroNegocio}"></div>

    <!-- Formulário ligado ao objeto "usuario" do controller -->
    <form th:action="@{/tarefas/criar}" th:object="${usuario}" method="post" class="modal-form">

        <!-- Nome -->
        <div class="campo-grupo" th:classappend="${#fields.hasErrors('nome')} ? 'erro'">
            <label class="campo-label" for="nome">Nome:</label>
            <input class="campo-input" type="text" id="nome" th:field="*{nome}" placeholder="" />
        </div>
        <span class="msg-erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>

        <!-- E-mail -->
        <div class="campo-grupo" th:classappend="${#fields.hasErrors('email')} ? 'erro'">
            <label class="campo-label" for="email">E-mail:</label>
            <input class="campo-input" type="email" id="email" th:field="*{email}" placeholder="" />
        </div>
        <span class="msg-erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <!-- Senha -->
        <div class="campo-grupo" th:classappend="${#fields.hasErrors('senha')} ? 'erro'">
            <label class="campo-label" for="senha">Senha:</label>
            <input class="campo-input" type="password" id="senha" th:field="*{senha}" placeholder="" />
        </div>
        <span class="msg-erro" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></span>

        <!-- Telefone + Data Nascimento -->
        <div class="campo-linha">
            <div class="campo-metade">
                <div class="campo-grupo" th:classappend="${#fields.hasErrors('telefone')} ? 'erro'">
                    <label class="campo-label" for="telefone">Telefone:</label>
                    <input class="campo-input" type="tel" id="telefone" th:field="*{telefone}"
                           placeholder="(--)-----*----" />
                </div>
                <span class="msg-erro" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></span>
            </div>
            <div class="campo-metade">
                <div class="campo-grupo" th:classappend="${#fields.hasErrors('dataNascimento')} ? 'erro'">
                    <label class="campo-label" for="dataNascimento">Data Nascimento:</label>
                    <input class="campo-input" type="date" id="dataNascimento" th:field="*{dataNascimento}" />
                </div>
                <span class="msg-erro" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}"></span>
            </div>
        </div>

        <!-- Setor + Cargo (selects populados pelo controller) -->
        <div class="campo-linha">
            <div class="campo-metade">
                <div class="campo-grupo">
                    <label class="campo-label" for="setor">Setor:</label>
                    <select id="setor" th:field="*{setor}">
                        <option value="">Selecione</option>
                        <option th:each="s : ${setores}"
                                th:value="${s.idSetor}"
                                th:text="${s.nomeSetor}"></option>
                    </select>
                </div>
            </div>
            <div class="campo-metade">
                <div class="campo-grupo">
                    <label class="campo-label" for="cargo">Cargo:</label>
                    <select id="cargo" th:field="*{cargo}">
                        <option value="">Selecione</option>
                        <option th:each="c : ${cargos}"
                                th:value="${c.idCargo}"
                                th:text="${c.nomeCargo}"></option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Botão -->
        <div class="modal-rodape">
            <button class="btn-criar" type="submit">Criar Tarefa</button>
        </div>

    </form>
</div>

</body>
</html>
