<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UP — Cadastro de Usuário</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-form">

<div class="overlay open">
    <div class="modal">

        <div class="modal-head">
            <h2 class="modal-title">Cadastro de Usuário</h2>
            <a class="modal-close" th:href="@{/dashboard}" title="Fechar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </a>
        </div>

        <div class="alerta-sucesso" th:if="${sucesso}" th:text="${sucesso}"></div>
        <div class="alerta-negocio" th:if="${erroNegocio}" th:text="${erroNegocio}"></div>

        <form th:action="@{/usuarios/criar}" th:object="${usuario}" method="post">

            <!-- Nome -->
            <div class="fg-full">
                <input class="inp" th:classappend="${#fields.hasErrors('nome')} ? 'err'"
                       type="text" th:field="*{nome}" placeholder="Nome:">
                <span class="ferr" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
            </div>

            <!-- E-mail -->
            <div class="fg-full">
                <input class="inp" th:classappend="${#fields.hasErrors('email')} ? 'err'"
                       type="email" th:field="*{email}" placeholder="E-mail:">
                <span class="ferr" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <!-- Senha -->
            <div class="fg-full">
                <input class="inp" th:classappend="${#fields.hasErrors('senha')} ? 'err'"
                       type="password" th:field="*{senha}" placeholder="Senha:">
                <span class="ferr" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></span>
            </div>

            <!-- Telefone + Data -->
            <div class="form-row">
                <div class="fg">
                    <div class="date-wrap">
                        <input class="inp" type="text" th:field="*{telefone}"
                               id="telefone" placeholder="Telefone:  (--)-----·----" maxlength="15">
                    </div>
                </div>
                <div class="fg">
                    <div class="date-wrap">
                        <input class="inp" type="date" th:field="*{dataNascimento}"
                               placeholder="Data Nascimento:">
                        <svg class="date-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Setor + Cargo -->
            <div class="form-row">
                <div class="fg">
                    <input class="inp" type="text" th:field="*{setor}" placeholder="Setor:">
                </div>
                <div class="fg">
                    <input class="inp" type="text" th:field="*{cargo}" placeholder="Cargo:">
                </div>
            </div>

            <div class="form-acts">
                <button type="submit" class="btn-cadastrar">Cadastrar</button>
            </div>

        </form>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
<script>
    // Máscara de telefone
    const tel = document.getElementById('telefone');
    if (tel) {
        tel.addEventListener('input', () => {
            let v = tel.value.replace(/\D/g, '').slice(0, 11);
            if (v.length <= 2) tel.value = v.length ? '(' + v : '';
            else if (v.length <= 7) tel.value = '(' + v.slice(0, 2) + ')' + v.slice(2);
            else tel.value = '(' + v.slice(0, 2) + ')' + v.slice(2, 7) + '-' + v.slice(7);
        });
    }
</script>
</body>
</html>
