<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PipeUp - Detalhes da Tarefa</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/detalhesTarefa.css}">
</head>
<body>

<div class="layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main">
        <div th:replace="~{fragments/header :: header}"></div>

        <!-- Barra laranja -->
        <div class="orange-bar">
            <div class="titulo-laranja">
                Detalhes <span class="btn-mais-laranja">+</span>
            </div>
        </div>

        <!-- Conteúdo principal -->
        <div class="detalhes-content">

            <!-- ── Coluna esquerda: formulário ── -->
            <form class="col-formulario"
                  th:action="@{/tarefas/{id}(id=${tarefa.id})}"
                  method="post">

                <!-- Alertas -->
                <div class="alerta-sucesso"   th:if="${sucesso}"      th:text="${sucesso}"></div>
                <div class="alerta-negocio"   th:if="${erroNegocio}"  th:text="${erroNegocio}"></div>

                <!-- Título -->
                <div class="tarefa-titulo-row">
                    <input class="tarefa-titulo-input"
                           type="text"
                           name="titulo"
                           maxlength="100"
                           placeholder="Título da tarefa"
                           th:value="${tarefa.titulo}"
                           required>
                    <button type="button" class="btn-mais">+</button>
                </div>

                <!-- Empresa (informativo — vinculada via espaço) -->
                <div class="campo-detalhe">
                    <label>Empresa</label>
                    <select name="empresaId" disabled>
                        <option th:each="emp : ${empresas}"
                                th:value="${emp.id}"
                                th:text="${emp.nome}"
                                th:selected="${tarefa.espaco != null
                                    and tarefa.espaco.empresa != null
                                    and tarefa.espaco.empresa.id == emp.id}">
                        </option>
                    </select>
                </div>

                <!-- Espaço -->
                <div class="campo-detalhe">
                    <label>Espaço</label>
                    <select name="espacoId" required>
                        <option value="">Selecione</option>
                        <option th:each="esp : ${espacos}"
                                th:value="${esp.id}"
                                th:text="${esp.nome}"
                                th:selected="${tarefa.espaco != null and tarefa.espaco.id == esp.id}">
                        </option>
                    </select>
                </div>

                <!-- Responsável (informativo) -->
                <div class="campo-detalhe">
                    <label>Responsável</label>
                    <select disabled>
                        <option value="">Nenhum atribuído</option>
                        <option th:each="u : ${responsaveis}"
                                th:value="${u.id}"
                                th:text="${u.nome}"
                                selected>
                        </option>
                    </select>
                </div>

                <!-- Status -->
                <div class="campo-detalhe">
                    <label>Status</label>
                    <select name="status" required>
                        <option th:each="s : ${statusOpcoes}"
                                th:value="${s.name()}"
                                th:text="${s.name().replace('_',' ')}"
                                th:selected="${tarefa.status == s}">
                        </option>
                    </select>
                </div>

                <!-- Prioridade -->
                <div class="campo-detalhe">
                    <label>Prioridade</label>
                    <select name="prioridade" required>
                        <option th:each="p : ${prioridadeOpcoes}"
                                th:value="${p.name()}"
                                th:text="${p.name()}"
                                th:selected="${tarefa.prioridade == p}">
                        </option>
                    </select>
                </div>

                <!-- Progresso -->
                <div class="campo-detalhe">
                    <label>Progresso: <span th:text="${tarefa.progresso != null ? tarefa.progresso.intValue() + '%' : '0%'}"></span></label>
                    <input type="range"
                           name="progresso"
                           min="0" max="100" step="1"
                           th:value="${tarefa.progresso != null ? tarefa.progresso.intValue() : 0}"
                           oninput="this.previousElementSibling.querySelector('span').textContent = this.value + '%'">
                </div>

                <!-- Descrição -->
                <textarea class="descricao-textarea"
                          name="descricao"
                          maxlength="500"
                          placeholder="Informações sobre a tarefa..."
                          th:text="${tarefa.descricao}"></textarea>

                <!-- Calendário + Datas importantes -->
                <div class="calendario-bloco">

                    <!-- Calendário navegável -->
                    <div class="calendario">
                        <div class="cal-header">
                            <!-- navegação: mês anterior -->
                            <a th:href="@{/tarefas/{id}(id=${tarefa.id},
                                calMes=${calMesAtual.monthValue == 1 ? 12 : calMesAtual.monthValue - 1},
                                calAno=${calMesAtual.monthValue == 1 ? calMesAtual.year - 1 : calMesAtual.year})}"
                               class="cal-nav">&lt;</a>

                            <span class="cal-titulo"
                                  th:text="${#temporals.format(calMesAtual.atDay(1), 'MMMM yyyy', new java.util.Locale('pt','BR'))}">
                            </span>

                            <!-- navegação: próximo mês -->
                            <a th:href="@{/tarefas/{id}(id=${tarefa.id},
                                calMes=${calMesAtual.monthValue == 12 ? 1 : calMesAtual.monthValue + 1},
                                calAno=${calMesAtual.monthValue == 12 ? calMesAtual.year + 1 : calMesAtual.year})}"
                               class="cal-nav">&gt;</a>
                        </div>

                        <div class="cal-grid">
                            <!-- cabeçalho dias da semana -->
                            <div class="cal-dia-semana">D</div>
                            <div class="cal-dia-semana">S</div>
                            <div class="cal-dia-semana">T</div>
                            <div class="cal-dia-semana">Q</div>
                            <div class="cal-dia-semana">Q</div>
                            <div class="cal-dia-semana">S</div>
                            <div class="cal-dia-semana">S</div>

                            <!-- células vazias antes do primeiro dia -->
                            <div class="cal-dia vazio"
                                 th:each="v : ${#numbers.sequence(1, calPrimeiroDia == 0 ? 0 : calPrimeiroDia)}">
                            </div>

                            <!-- dias do mês -->
                            <div th:each="d : ${#numbers.sequence(1, calDiasNoMes)}"
                                 th:with="diaAtual=${calMesAtual.atDay(d)}"
                                 th:classappend="${diaAtual == hoje} ? 'hoje'
                                              : (${tarefa.dataInicio != null and diaAtual == tarefa.dataInicio}
                                                 or ${tarefa.dataEntrega != null and diaAtual == tarefa.dataEntrega}) ? 'marcado'"
                                 class="cal-dia"
                                 th:text="${d}">
                            </div>
                        </div>
                    </div>

                    <!-- Datas importantes -->
                    <div class="datas-importantes">
                        <h4>Datas Importantes</h4>

                        <div class="data-campo">
                            <label for="dataInicio">Data de Início</label>
                            <input type="date"
                                   id="dataInicio"
                                   name="dataInicio"
                                   th:value="${tarefa.dataInicio}">
                        </div>

                        <div class="data-campo">
                            <label for="dataEntrega">Data de Entrega</label>
                            <input type="date"
                                   id="dataEntrega"
                                   name="dataEntrega"
                                   th:value="${tarefa.dataEntrega}">
                        </div>
                    </div>
                </div>

                <!-- Botão salvar -->
                <button type="submit" class="btn-salvar">Salvar</button>

            </form>

            <!-- ── Coluna direita: abas e histórico ── -->
            <div class="col-historico">

                <!-- Abas -->
                <div class="abas">
                    <a th:href="@{/tarefas/{id}(id=${tarefa.id}, abaAtiva='NOTA')}"
                       th:classappend="${abaAtiva == 'NOTA'} ? ' ativa'"
                       class="aba-btn">
                        Notas
                        <span class="aba-badge" th:text="${totalNotas}"></span>
                    </a>
                    <a th:href="@{/tarefas/{id}(id=${tarefa.id}, abaAtiva='ATIVIDADE')}"
                       th:classappend="${abaAtiva == 'ATIVIDADE'} ? ' ativa'"
                       class="aba-btn">
                        Atividade
                        <span class="aba-badge" th:text="${totalAtividades}"></span>
                    </a>
                    <a th:href="@{/tarefas/{id}(id=${tarefa.id}, abaAtiva='ARQUIVO')}"
                       th:classappend="${abaAtiva == 'ARQUIVO'} ? ' ativa'"
                       class="aba-btn">
                        Arquivos
                        <span class="aba-badge" th:text="${totalArquivos}"></span>
                    </a>
                </div>

                <!-- Campo adicionar atividade -->
                <form class="adicionar-bloco"
                      th:action="@{/tarefas/{id}/atividades(id=${tarefa.id})}"
                      method="post">

                    <input type="hidden" name="tipo" th:value="${abaAtiva}">

                    <label>Documentos</label>
                    <div class="adicionar-row">
                        <textarea class="adicionar-input"
                                  name="descricao"
                                  maxlength="255"
                                  th:placeholder="'* Adicione uma ' + ${abaAtiva.toLowerCase()} + ' aqui...'"></textarea>
                        <button type="submit" class="btn-adicionar">Adicionar</button>
                    </div>
                </form>

                <!-- Histórico -->
                <div class="historico-bloco">
                    <div class="historico-header">
                        <span class="historico-titulo">Histórico</span>
                        <div class="historico-filtros">
                            <a th:href="@{/tarefas/{id}(id=${tarefa.id})}"
                               th:classappend="${abaAtiva == 'ATIVIDADE'} ? ' ativo'"
                               class="filtro-btn">Todos</a>
                            <a th:href="@{/tarefas/{id}(id=${tarefa.id}, abaAtiva='NOTA')}"
                               th:classappend="${abaAtiva == 'NOTA'} ? ' ativo'"
                               class="filtro-btn"
                               th:text="'Notas (' + ${totalNotas} + ')'"></a>
                            <a th:href="@{/tarefas/{id}(id=${tarefa.id}, abaAtiva='ATIVIDADE')}"
                               th:classappend="${abaAtiva == 'ATIVIDADE'} ? ' ativo'"
                               class="filtro-btn"
                               th:text="'Atividades (' + ${totalAtividades} + ')'"></a>
                            <a th:href="@{/tarefas/{id}(id=${tarefa.id}, abaAtiva='ARQUIVO')}"
                               th:classappend="${abaAtiva == 'ARQUIVO'} ? ' ativo'"
                               class="filtro-btn"
                               th:text="'Arquivos (' + ${totalArquivos} + ')'"></a>
                        </div>
                    </div>

                    <!-- Lista de entradas -->
                    <div th:if="${historico.isEmpty()}" class="historico-vazio">
                        Nenhuma entrada no histórico ainda.
                    </div>

                    <div th:each="item : ${historico}" class="historico-item">
                        <div class="historico-item-info">
                            <span class="historico-item-tipo" th:text="${item.tipo}"></span>
                            <span class="historico-item-descricao" th:text="${item.descricao}"></span>
                            <span class="historico-item-data"
                                  th:text="${#temporals.format(item.dataTime, 'yyyy/MM/dd HH:mm')}"></span>
                        </div>
                        <div class="historico-item-acoes">
                            <button type="button" class="acao-btn" title="Visualizar">👁</button>
                            <button type="button" class="acao-btn" title="Documento">📄</button>
                            <button type="button" class="acao-btn" title="Favoritar">☆</button>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/js/sidebar.js}"></script>

</body>
</html>
