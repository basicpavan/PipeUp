<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PipeUp - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>
<div class="layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main">

        <!-- HEADER -->
        <div class="header">
            <form action="/dashboard" method="get" class="search-box">
                <img th:src="@{/img/icon-search.png}" alt="Pesquisar" class="search-icon">
                <input type="text" name="filtro" placeholder="Pesquisar tarefa">
            </form>
            <div class="header-icons">
                <button type="button" class="header-btn"><img th:src="@{/img/icon-menu.png}" alt="Menu"></button>
                <button type="button" class="header-btn"><img th:src="@{/img/icon-bell.png}" alt="Notificações">
                </button>
                <button type="button" class="header-btn"><img th:src="@{/img/icon-gear.png}" alt="Config"></button>
                <div class="avatar"><img th:src="@{/img/icon-avatar.png}" alt="Avatar"></div>
            </div>
        </div>

        <!-- ORANGE BAR -->
        <!-- O botão + aqui é apenas decorativo (exibe o nome do espaço ativo) -->
        <!-- A criação de tarefas ocorre pelo + de cada coluna Kanban abaixo   -->
        <div class="orange-bar">
            <div class="titulo-laranja">
                Recrutamento
                <span class="btn-mais-laranja">+</span>
            </div>
        </div>

        <!-- CONTENT — Kanban board -->
        <div class="content">
            <div class="board-container">

                <div th:each="status : ${statusOpcoes}" class="board-coluna">
                    <div class="coluna-topo">
                        <span th:text="${status.displayName}"></span>
                        <!--
                            Botão + de cada coluna: abre o formulário de nova tarefa
                            com o status da coluna pré-selecionado.
                        -->
                        <a th:href="@{/tarefas/nova(status=${status.name()})}"
                           class="coluna-btn"
                           style="text-decoration: none; color: inherit;">+</a>
                    </div>
                    <div class="coluna-cartoes">
                        <a th:each="t : ${tarefas}"
                           th:if="${t.status == status}"
                           class="cartao"
                           th:href="@{/tarefas/{id}(id=${t.id})}">
                            <div class="cartao-topo">
                                <span class="cartao-titulo" th:text="${t.titulo}"></span>
                            </div>
                            <div class="cartao-rodape"
                                 th:text="${t.dataEntrega != null ? '📅 ' + t.dataEntrega : '📅 Sem data'}">
                            </div>
                        </a>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<script th:src="@{/js/dashboard.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
