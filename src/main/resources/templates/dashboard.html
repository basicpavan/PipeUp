<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PipeUp - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Instrument Sans', sans-serif; background: #111; color: #fff; height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; }
        button, input { font-family: inherit; }

        .layout { display: flex; height: 100vh; width: 100%; }

        .sidebar-mini {
            width: 80px; min-width: 80px; background: linear-gradient(180deg,#1b1b1b,#101010);
            display: flex; flex-direction: column; align-items: center; padding: 10px 8px;
        }
        .mini-logo { width: 52px; margin-bottom: 22px; }
        .mini-logo img { width: 52px; display: block; }
        .mini-nav { display: flex; flex-direction: column; gap: 18px; width: 100%; align-items: center; }
        .mini-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #fff; }
        .mini-icon-box { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
        .mini-item:hover .mini-icon-box { background: rgba(255,255,255,0.1); }
        .mini-icon-box img { width: 28px; height: 28px; object-fit: contain; display: block; }
        .mini-item span { font-size: 0.72rem; font-weight: 700; }

        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

        .header { height: 56px; background: #1a1a1a; display: flex; align-items: center; justify-content: flex-end; padding: 0 18px; position: relative; flex-shrink: 0; }
        .search-box { position: absolute; left: 50%; transform: translateX(-50%); width: 365px; height: 36px; background: #2b2b2b; border-radius: 999px; display: flex; align-items: center; padding: 0 14px; gap: 10px; }
        .search-box input { border: none; outline: none; background: transparent; color: #fff; font-size: 0.95rem; width: 100%; }
        .search-box input::placeholder { color: #aaa; }
        .search-icon { width: 18px; height: 18px; opacity: 0.8; display: block; }
        .header-icons { display: flex; align-items: center; gap: 10px; }
        .header-btn { width: 38px; height: 38px; border: none; background: transparent; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .header-btn img { width: 24px; height: 24px; opacity: 0.9; display: block; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #9d9d9d; overflow: hidden; border: 2px solid rgba(255,255,255,0.15); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .orange-bar { height: 40px; background: linear-gradient(180deg,#FB7D29,#f07020); display: flex; align-items: center; padding: 0 20px; flex-shrink: 0; }
        .titulo-laranja { font-size: 1rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
        .btn-mais-laranja { background: rgba(255,255,255,0.25); padding: 2px 8px; border-radius: 4px; font-size: 0.9rem; cursor: pointer; }

        .content { flex: 1; padding: 12px; overflow: hidden; background: #111; }
        .board-container { display: flex; gap: 14px; height: calc(100vh - 56px - 40px - 24px); overflow-x: auto; padding-bottom: 8px; }
        .board-container::-webkit-scrollbar { height: 6px; }
        .board-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 999px; }

        .board-coluna { flex: 0 0 260px; background: #797272; border-radius: 12px; display: flex; flex-direction: column; height: 100%; }
        .coluna-topo { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; font-size: 0.92rem; font-weight: 700; border-bottom: 2px solid rgba(0,0,0,0.1); }
        .coluna-btn { background: rgba(0,0,0,0.15); padding: 2px 8px; border-radius: 6px; font-size: 0.85rem; color: rgba(255,255,255,0.8); cursor: pointer; }
        .coluna-cartoes { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .coluna-cartoes::-webkit-scrollbar { width: 4px; }
        .coluna-cartoes::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 999px; }

        .cartao { display: block; background: #554F4F; border-radius: 10px; padding: 12px; transition: filter 0.15s; }
        .cartao:hover { filter: brightness(1.1); }
        .cartao-topo { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .cartao-titulo { font-weight: 600; font-size: 0.9rem; }
        .cartao-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; display: block; }
        .cartao-rodape { font-size: 0.8rem; color: rgba(255,255,255,0.7); }
    </style>
</head>
<body>
<div class="layout">

    <div class="sidebar-mini">
        <div class="mini-logo"><img th:src="@{/img/logo-up.png}" alt="UP"></div>
        <nav class="mini-nav">
            <a href="/dashboard" class="mini-item">
                <div class="mini-icon-box"><img th:src="@{/img/icon-home.png}" alt="Início"></div>
                <span>Início</span>
            </a>
            <a href="/empresas" class="mini-item">
                <div class="mini-icon-box"><img th:src="@{/img/icon-company.png}" alt="Empresas"></div>
                <span>Empresas</span>
            </a>
            <a href="/usuarios" class="mini-item">
                <div class="mini-icon-box"><img th:src="@{/img/icon-users.png}" alt="Usuários"></div>
                <span>Usuários</span>
            </a>
        </nav>
    </div>

    <div class="main">
        <div class="header">
            <form action="/dashboard" method="get" class="search-box">
                <img th:src="@{/img/icon-search.png}" alt="Pesquisar" class="search-icon">
                <input type="text" name="filtro" placeholder="Pesquisar tarefa">
            </form>
            <div class="header-icons">
                <button type="button" class="header-btn"><img th:src="@{/img/icon-menu.png}" alt="Menu"></button>
                <button type="button" class="header-btn"><img th:src="@{/img/icon-bell.png}" alt="Notificações"></button>
                <button type="button" class="header-btn"><img th:src="@{/img/icon-gear.png}" alt="Config"></button>
                <div class="avatar"><img th:src="@{/img/icon-avatar.png}" alt="Avatar"></div>
            </div>
        </div>

        <div class="orange-bar">
            <div class="titulo-laranja">Recrutamento 
                <a href="/tarefas/nova" class="btn-mais-laranja" style="text-decoration: none; color: inherit;">+</a>
            </div>
        </div>

        <div class="content">
            <div class="board-container">

                <div th:each="status : ${statusOpcoes}" class="board-coluna">
                    <div class="coluna-topo">
                        <span th:text="${status.displayName}"></span>
                        <a href="/tarefas/nova" class="coluna-btn" style="text-decoration: none; color: inherit;">+</a>
                    </div>
                    <div class="coluna-cartoes">
                        <a th:each="t : ${tarefas}" th:if="${t.status == status}"
                           class="cartao" th:href="@{/tarefas/{id}(id=${t.id})}">
                            <div class="cartao-topo">
                                <span class="cartao-titulo" th:text="${t.titulo}"></span>
                                <img src="https://i.pravatar.cc/150?img=11" class="cartao-avatar" alt="avatar">
                            </div>
                            <div class="cartao-rodape" th:text="${t.dataEntrega != null ? '📅 ' + t.dataEntrega : '📅 Sem data'}"></div>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
</body>
<script th:src="@{/js/dashboard.js}"></script>
</html>
